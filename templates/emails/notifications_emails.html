<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ title }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background:#ffffff; border-radius:10px; overflow:hidden;">
        <tr><td align="center" style="background:#1f4fd8; padding:24px;">
          <span style="color:#ffffff; font-size:22px; font-weight:bold;">{{ app_name }}</span>
        </td></tr>
        <tr><td style="padding:28px; color:#1f2933; font-size:16px; line-height:1.6;">
          <p style="margin:0 0 12px 0;">Hi {% if user.first_name %}{{ user.first_name }}{% else %}there{% endif %},</p>
          <h3 style="margin:0 0 12px 0;">{{ title }}</h3>
          <p style="margin:0;">{{ message }}</p>
        </td></tr>
        <tr><td style="padding:0 28px 24px 28px; color:#9aa5b1; font-size:12px; line-height:1.5;">
          You received this email because of activity on your {{ app_name }} account.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
